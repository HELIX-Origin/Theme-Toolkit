[package]
name = "theme-toolkit"
version = "0.1.0-alpha"
description = "Cross-platform desktop theme authoring and packaging studio (Windows, macOS, Linux)"
edition = "2021"
authors = ["HELIX Origin"]
license = "BSD-3-Clause"

[lib]
name = "theme_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_System_Registry", "Win32_Foundation"] }
